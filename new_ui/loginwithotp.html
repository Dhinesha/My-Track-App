<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TravelSync Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#2b8cee",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
              "surface-light": "#ffffff",
              "surface-dark": "#1e293b",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {
                "DEFAULT": "0.25rem", 
                "lg": "0.5rem", 
                "xl": "0.75rem",
                "2xl": "1rem", 
                "3xl": "1.5rem", 
                "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
        /* Custom scrollbar hide for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col justify-center items-center py-8 px-4 sm:px-6 transition-colors duration-300">
<!-- Main Container -->
<div class="w-full max-w-[420px] bg-surface-light dark:bg-surface-dark rounded-3xl shadow-xl overflow-hidden border border-slate-100 dark:border-slate-800 relative flex flex-col">
<!-- Decorative Header / Image -->
<div class="relative h-40 w-full overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-blue-500 to-primary opacity-90 z-10"></div>
<!-- Abstract travel pattern background -->
<img alt="Abstract view of a desert landscape symbolizing travel and adventure" class="absolute inset-0 w-full h-full object-cover mix-blend-overlay opacity-60 z-0" data-alt="Abstract view of a desert landscape symbolizing travel and adventure" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHIotHNHLs7KlwpVGuRSIcZorR9QSOJDwLHuQQMvh5kvH13wNrngOYGC84b-YgJ7tR87R1WXgdsVx-AjhlW_rFUsL5hydBIE9aIYfPSA4AH0YD_mrKkA4h2LXpF19FG0J3Zx9L8tmkOscWhRty5H27ZGLpF3rfZya9p0DQaOo-2tA6Zz6sawAS0njvt5Ge_gjVOi34UU189ZxJJx7Q6CIRuwutdQ8X2D2RDrFFcKCBiNhdVUwQpx9iKwtMCfkUCrcuLeTCYRIPJeo"/>
<div class="relative z-20 h-full flex flex-col items-center justify-center text-white pt-4">
<div class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center mb-3 shadow-lg border border-white/30">
<span class="material-symbols-outlined text-3xl">flight_takeoff</span>
</div>
<h2 class="text-2xl font-bold tracking-tight">TravelSync</h2>
</div>
</div>
<!-- Content Body -->
<div class="flex flex-col px-6 pt-6 pb-8">
<!-- Headline Component -->
<div class="mb-6 text-center">
<h1 class="text-slate-900 dark:text-white text-2xl font-bold leading-tight">Login</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Enter your details to access your trips</p>
</div>
<!-- Step 1: Phone Input -->
<div class="space-y-4">
<label class="block">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold mb-2 block ml-1">Mobile Number</span>
<div class="flex gap-3">
<!-- Country Code -->
<div class="relative w-[88px]">
<div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none z-10">
<span class="material-symbols-outlined text-slate-400 text-[20px]">flag</span>
</div>
<select class="block w-full rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary pl-10 pr-2 h-12 text-sm appearance-none cursor-pointer">
<option>+1</option>
<option>+44</option>
<option>+91</option>
<option>+33</option>
</select>
</div>
<!-- Phone Input -->
<div class="relative flex-1">
<input class="block w-full rounded-xl border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm focus:border-primary focus:ring-primary h-12 px-4 text-base placeholder:text-slate-400" placeholder="555 123 4567" type="tel" value=""/>
</div>
</div>
</label>
<!-- Get OTP Button -->
<button class="w-full flex items-center justify-center gap-2 rounded-xl h-12 px-5 bg-primary hover:bg-blue-600 active:bg-blue-700 text-white text-sm font-bold tracking-wide transition-all shadow-md shadow-blue-500/20 group">
<span>Get OTP</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
</button>
</div>
<!-- Visual Divider -->
<div class="relative py-8">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-100 dark:border-slate-700"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-surface-light dark:bg-surface-dark px-3 text-xs font-medium text-slate-400 uppercase tracking-widest">Verification</span>
</div>
</div>
<!-- Step 2: OTP Input -->
<div class="space-y-6">
<div class="flex flex-col items-center">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold mb-3">Enter Verification Code</label>
<div class="flex justify-center w-full">
<fieldset class="flex gap-2 sm:gap-3 justify-center">
<!-- 4 Digit OTP as requested (4-6) -->
<input class="w-12 h-14 text-center rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-2xl font-semibold text-slate-900 dark:text-white focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" type="text" value="4"/>
<input class="w-12 h-14 text-center rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-2xl font-semibold text-slate-900 dark:text-white focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" type="text" value="2"/>
<input class="w-12 h-14 text-center rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-2xl font-semibold text-slate-900 dark:text-white focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" placeholder="-" type="text"/>
<input class="w-12 h-14 text-center rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-2xl font-semibold text-slate-900 dark:text-white focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" placeholder="-" type="text"/>
</fieldset>
</div>
<div class="mt-3 flex items-center justify-between w-full px-2">
<p class="text-xs text-slate-400">Sent to +1 555...</p>
<button class="text-xs font-semibold text-primary hover:text-blue-600 transition-colors">Resend Code</button>
</div>
</div>
<!-- Verify Button -->
<button class="w-full flex items-center justify-center gap-2 rounded-xl h-12 px-5 bg-primary hover:bg-blue-600 active:bg-blue-700 text-white text-base font-bold tracking-wide transition-all shadow-lg shadow-blue-500/30">
<span class="material-symbols-outlined text-[20px]">lock_open</span>
<span>Verify OTP</span>
</button>
</div>
<!-- Helper Text Footer -->
<div class="mt-8 pt-4 border-t border-slate-50 dark:border-slate-800 text-center">
<div class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-blue-50 dark:bg-blue-900/20 text-blue-700 dark:text-blue-300">
<span class="material-symbols-outlined text-[16px]">info</span>
<p class="text-xs font-medium">Only primary traveller or admin can login</p>
</div>
</div>
</div>
</div>
<!-- App Version / Subtle footer outside card -->
<div class="mt-6 text-center opacity-40">
<p class="text-xs text-slate-500 dark:text-slate-400 font-medium">TravelSync v2.1.0 © 2024</p>
</div>
</body></html>
